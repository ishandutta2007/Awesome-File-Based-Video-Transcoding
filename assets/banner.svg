<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79c0ff" />
      <stop offset="50%" stop-color="#d2a8ff" />
      <stop offset="100%" stop-color="#ffa657" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Dynamic / Animated Background Wave Elements (Background Layer) -->
  <g opacity="0.25">
    <path d="M-100 300 C 200 150, 400 380, 800 200 C 1000 100, 1200 250, 1300 180 V 450 H -100 Z" fill="#1f6feb">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="
          M-100 300 C 200 150, 400 380, 800 200 C 1000 100, 1200 250, 1300 180 V 450 H -100 Z;
          M-100 280 C 300 220, 500 180, 750 280 C 950 350, 1150 180, 1300 220 V 450 H -100 Z;
          M-100 300 C 200 150, 400 380, 800 200 C 1000 100, 1200 250, 1300 180 V 450 H -100 Z
        " />
    </path>
    <path d="M-100 350 C 150 200, 450 320, 700 220 C 950 120, 1100 300, 1300 200 V 450 H -100 Z" fill="#8957e5">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="
          M-100 350 C 150 200, 450 320, 700 220 C 950 120, 1100 300, 1300 200 V 450 H -100 Z;
          M-100 320 C 250 280, 400 200, 800 180 C 1000 280, 1200 150, 1300 250 V 450 H -100 Z;
          M-100 350 C 150 200, 450 320, 700 220 C 950 120, 1100 300, 1300 200 V 450 H -100 Z
        " />
    </path>
  </g>

  <!-- Animated Glowing Dynamic Dots Grid in Background -->
  <g fill="#388bfd" opacity="0.3">
    <circle cx="150" cy="80" r="3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="120" r="4">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="320" r="3">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="330" r="5">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Dynamic Tech Pill Badges at Bottom (Kept away from main text) -->
  <g transform="translate(0, 310)" filter="url(#soft-shadow)">
    <!-- H.264 / HEVC / AV1 / VMAF floating badges -->
    <g transform="translate(320, 0)">
      <rect x="0" y="0" width="110" height="34" rx="17" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <text x="55" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#79c0ff" text-anchor="middle">⚡ AV1 / SVT</text>
    </g>
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="110" height="34" rx="17" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <text x="55" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#7ee787" text-anchor="middle">🎬 FFmpeg</text>
    </g>
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffa657" text-anchor="middle">📊 VMAF Quality</text>
    </g>
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <text x="70" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#d2a8ff" text-anchor="middle">☁️ Cloud VOD</text>
    </g>
  </g>

  <!-- Main Title & Subtitle (Clear Foreground Layer - Unobstructed) -->
  <g text-anchor="middle" transform="translate(600, 140)" filter="url(#soft-shadow)">
    <!-- Top Category Tag -->
    <rect x="-140" y="-75" width="280" height="28" rx="14" fill="rgba(56, 139, 253, 0.15)" stroke="#388bfd" stroke-width="1"/>
    <text x="0" y="-56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="2">CURATED AWESOME DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
      Awesome File-Based Video Transcoding
    </text>

    <!-- Subtitle -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#8b949e">
      Enterprise Cloud VOD Services • Open-Source Encoders • AV1 / HEVC Pipelines
    </text>
  </g>
</svg>
